<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="calculator">
		<div class="result">
			<h1 class="result-header"></h1>
		</div>
		<div class="operations">
			<div class="number-input">
				<input type="number" class="number-field" placeholder="First Number">
				<input type="number" class="number-field" placeholder="Second Number">
			</div>
			<div class="buttons">
				<button class="add-btn">+</button>
				<button class="subtract-btn">-</button>
				<button class="multiply-btn">x</button>
				<button class="divide-btn">/</button>
				<button class="clean">Clean</button>
			</div>
		</div>
		<div class="history">
			<h2>History</h2>
			<ul class="history-list">

			</ul>
		</div>
	</main>
</body>
<script src="index.js"></script>
</html>
